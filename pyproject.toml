[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Agente de voz conversacional mínimo en Python puro con asyncio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Audio
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",

    # STT
    "openai-whisper>=20231117",

    # LLM
    "openai>=1.30",
    "httpx>=0.27",

    # TTS
    "pyttsx3>=2.90",

    # API / WebSockets
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",

    # Utils
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",  # para TestClient de FastAPI
]

cloud = [
    "deepgram-sdk>=3.4",    # STT alternativo en la nube
    "elevenlabs>=1.4",      # TTS premium
]

[project.scripts]
voice-agent = "src.core.pipeline:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
